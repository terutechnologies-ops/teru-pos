services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teru_pos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teru_pos}
      POSTGRES_DB: ${POSTGRES_DB:-teru_pos_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teru_pos}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
